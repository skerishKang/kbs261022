<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 관리 | CGI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../website/assets/img/cgi-mark-green.png">
<link rel="stylesheet" href="assets/css/cgi-catalog.css?v=79a">
<link rel="stylesheet" href="assets/css/cgi-staff-orders.css?v=75a">
</head>
<body>

<a class="skip-link" href="#app">본문으로 건너뛰기</a>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a class="brand" href="index.html" aria-label="CGI 상품 카탈로그">
      <img src="../website/assets/img/cgi-mark-white.png" alt="CGI (주)시지아이" width="132" height="42">
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-text">
        <strong>주문 관리</strong>
        <small>STAFF ONLY</small>
      </span>
    </a>

    <nav class="header-nav" id="siteNav" aria-label="주요 메뉴">
      <a href="index.html">상품 카탈로그</a>
      <a href="staff.html">견적 관리</a>
      <a href="orders.html" class="is-active" aria-current="page">주문 관리</a>
      <a href="../website/index.html">회사 홈페이지</a>
    </nav>
  </div>
</header>

<main id="app" class="app staff-app">
  <header class="page-head">
    <p class="page-eyebrow">ORDERS</p>
    <h1>주문 관리</h1>
    <p class="page-sub">주문·결제·환불·ERP 동기화 상태를 확인합니다. 관리자 계정으로 로그인하세요.</p>
  </header>

  <section id="authBox" class="auth-box" hidden>
    <div id="memberPanel">
      <label>이메일 <input type="email" id="memberEmail" autocomplete="username"></label>
      <label>비밀번호 <input type="password" id="memberPassword" autocomplete="current-password"></label>
      <button type="button" class="btn" id="memberLoginBtn">로그인</button>
      <div class="auth-divider"><span>또는</span></div>
      <button type="button" class="btn btn-google btn-block" id="memberGoogleBtn">
        <svg viewBox="0 0 24 24"><path d="M12 11h3.02c.69-1.02 1.42-1.58 2.44-1.64v-2.87c-1.13-.12-2.61.38-3.8 1.66L12 6.6v4.4z" fill="#4285F4"/><path d="M11.4 14.5l-3.5 2.5c-1.17-.82-1.92-2.24-1.92-3.89 0-.7.18-1.38.5-1.97L2.56 7.6A8.5 8.5 0 0 0 1 12.1c0 4.1 2.9 7.53 6.8 8.35l4.6-5.95z" fill="#34A853"/><path d="M20.1 8.5c-.38-.7-.86-1.32-1.42-1.83L15.9 5.6 11.4 8.1l4.2 3.2c.9-.5 1.5-1.36 1.76-2.4l2.74-1.4z" fill="#FBBC05"/><path d="M11.4 14.5l4.2 3.2c1.6-.9 2.8-2.4 3.2-4.1.24-1 .18-2-.1-2.9h-3.1c-.14 1.5-.87 2.6-1.7 3.2l-2.5-.4z" fill="#EA4335"/></svg>
        Google로 계속하기
      </button>
      <p class="form-note">CGI 회원 계정으로 로그인합니다. 비밀번호가 없는 총관리자 계정은 Google로 계속하세요. 관리자 권한이 있는 계정만 주문 관리에 접근할 수 있어요.</p>
    </div>
    <div id="authMsg"></div>
  </section>

  <section id="adminManageBox" hidden class="auth-box">
    <h2>관리자 계정 관리 (총관리자)</h2>
    <div id="memberList"></div>
  </section>

  <section id="ordersApp" hidden>
    <section class="order-toolbar" aria-label="주문 필터">
      <label>검색<input type="search" id="filterQ" placeholder="주문번호 · 회사 · 연락처"></label>
      <label>유형
        <select id="filterKind">
          <option value="">전체</option>
          <option value="purchase">결제 주문</option>
          <option value="quote">견적 주문</option>
        </select>
      </label>
      <label>상태
        <select id="filterStatus"><option value="">전체</option></select>
      </label>
      <label>결제
        <select id="filterPayment"><option value="">전체</option></select>
      </label>
      <button type="button" class="btn btn-secondary" id="refreshBtn">새로고침</button>
      <button type="button" class="btn btn-secondary" id="logoutBtn">로그아웃</button>
    </section>

    <div id="orderList"></div>
  </section>

  <section id="orderDrawer" class="order-drawer" hidden>
    <button type="button" class="drawer-close" id="drawerClose" aria-label="닫기">✕</button>
    <div id="drawerBody"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>© 주식회사 시지아이. All rights reserved.</p>
  </div>
</footer>

<script src="config.js"></script>
<script src="data/products.js"></script>
<script src="data/services.js"></script>
<script src="assets/js/cgi-auth.js?v=79a"></script>
<script src="assets/js/cgi-refund.js?v=73a"></script>
<script src="assets/js/cgi-staff-orders.js?v=76a"></script>
</body>
</html>
