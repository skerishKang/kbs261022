name: Site tests

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site-tests.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Site unit tests
        run: node --test "site/test/"*.test.mjs
      - name: Every site script still parses
        run: |
          shopt -s nullglob
          for f in site/assets/js/*.js; do node --check "$f" || exit 1; done
