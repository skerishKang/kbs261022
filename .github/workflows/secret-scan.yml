name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for plaintext credentials
        run: python tools/security/scan_secrets.py
      - name: Run scanner unit tests
        run: python -m unittest tools.security.tests.test_scan_secrets -v
