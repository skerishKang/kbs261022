<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관심공고 | CGI 입찰정보</title>
<meta name="description" content="별표로 저장한 입찰공고를 검토중·투찰예정·투찰완료·포기 상태로 관리하는 화면.">
<link rel="canonical" href="https://cgishop.pages.dev/bid/watchlist.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CGI 입찰정보">
<meta property="og:title" content="관심공고 | CGI 입찰정보">
<meta property="og:description" content="별표로 저장한 입찰공고를 검토중·투찰예정·투찰완료·포기 상태로 관리하는 화면.">
<meta property="og:url" content="https://cgishop.pages.dev/bid/watchlist.html">
<meta name="theme-color" content="#07913A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307913A'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3EC%3C/text%3E%3C/svg%3E">
<script>(function(){try{var t=localStorage.getItem("bid-theme");if(t==="light"||t==="dark"){document.documentElement.dataset.theme=t;}}catch(e){}})();</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/bid.css?v=261106a">
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<header id="appHeader"></header>

<main id="main" class="page container">
  <nav class="crumbs" aria-label="위치">
    <a href="index.html">홈</a><span aria-hidden="true">›</span><span>관심공고</span>
  </nav>

  <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
    <h1 style="margin:0 0 4px;font-size:22px;letter-spacing:-.4px">관심공고</h1>
    <a class="btn btn-outline btn-sm" href="calendar.html" style="margin-left:auto">일정 캘린더로 보기 →</a>
  </div>
  <p style="margin:0 0 18px;color:var(--cgi-muted);font-size:13.5px">
    별표로 저장한 공고를 상태와 메모로 관리합니다. 저장은 이 기기(브라우저)에만 기록됩니다.
  </p>

  <div class="date-chip" id="dateChip" hidden>
    <span id="dateChipLabel"></span>
    <button type="button" class="f-x" id="dateChipClear" aria-label="날짜 조건 해제">✕</button>
  </div>
  <div class="tabs" role="tablist" aria-label="관심 상태" id="stateTabs"></div>

  <div id="listArea"></div>
</main>

<footer id="appFooter"></footer>

<script src="config.js?v=261106a"></script>
<script src="assets/data/bid-data.js?v=261106a"></script>
<script src="assets/data/result-data.js?v=261106a"></script>
<script src="assets/js/bid-ui.js?v=261106a"></script>
<script src="assets/js/bid-personal.js?v=261106a"></script>
<script>
(function () {
  "use strict";
  var U = window.BID_UI;
  var P = window.BID_PERS;
  U.renderHeader("watch");
  U.renderFooter();

  var dateFilter = U.param("date");
  var st = { state: U.param("state") || "전체" };

  var dateChip = document.getElementById("dateChip");
  if (dateFilter) {
    document.getElementById("dateChipLabel").textContent =
      "일정 날짜: " + dateFilter.replace(/-/g, ".") + " (캘린더에서 넘어온 날짜)";
    dateChip.hidden = false;
  }
  document.getElementById("dateChipClear").addEventListener("click", function () {
    location.href = "watchlist.html";
  });

  /* 관심 상태 탭 */
  var tabsEl = document.getElementById("stateTabs");
  function paintTabs(stars) {
    var states = ["전체"].concat(P.STAR_STATES);
    tabsEl.innerHTML = states.map(function (s) {
      var n = s === "전체" ? Object.keys(stars).length
        : Object.keys(stars).filter(function (no) { return stars[no].state === s; }).length;
      return '<button type="button" class="tab" role="tab" data-state="' + s + '" aria-selected="' + (st.state === s) + '">' +
        U.esc(s) + '<span class="t-count num">' + n + "</span></button>";
    }).join("");
  }
  tabsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".tab");
    if (!btn) return;
    st.state = btn.dataset.state;
    tabsEl.querySelectorAll(".tab").forEach(function (t) {
      t.setAttribute("aria-selected", String(t.dataset.state === st.state));
    });
    render();
  });

  function onDate(b) {
    if (!dateFilter) return true;
    return P.calEvents(b).some(function (ev) { return ev.date === dateFilter; });
  }

  function rowHtml(no, star, b) {
    var head = b ? (
      '<div class="watch-main">' +
        '<div class="watch-badges">' + U.badgeCat(b.c) + U.methodBadge(b) + U.badgeStatus(b.s) + U.chipDd(b) + U.mkChips(b, 3) + "</div>" +
        '<h3 class="bid-card-title"><a href="bid.html?no=' + encodeURIComponent(no) + '">' + U.esc(b.t) + "</a></h3>" +
        '<div class="bid-card-meta"><span class="agency">' + U.esc(b.a) + "</span>" +
          (b.r ? '<span class="region">' + U.esc(b.r) + "</span>" : "") +
          '<span class="k">투찰마감</span><span class="v num">' + U.esc(b.lt ? "상시 접수" : (b.cd ? U.fmtDt(b.cd) : "개찰 " + U.fmtDt(b.od))) + "</span>" +
        "</div>" +
      "</div>"
    ) : (
      '<div class="watch-main"><div class="bid-card-meta">수집 데이터에 없는 공고번호입니다: <span class="num">' + U.esc(no) + "</span></div></div>"
    );
    return (
      '<article class="watch-row" data-no="' + U.esc(no) + '">' +
        '<div class="watch-star">' + P.starBtnHtml(no) + "</div>" +
        head +
        '<div class="watch-ctrl">' +
          '<label class="sr-only" for="ws-' + U.esc(no) + '">관심 상태</label>' +
          '<select id="ws-' + U.esc(no) + '" class="watch-state">' +
            P.STAR_STATES.map(function (s) {
              return '<option value="' + s + '"' + (star.state === s ? " selected" : "") + ">" + s + "</option>";
            }).join("") +
          "</select>" +
          '<label class="sr-only" for="wm-' + U.esc(no) + '">관심 메모</label>' +
          '<input type="text" class="watch-memo" id="wm-' + U.esc(no) + '" maxlength="200" placeholder="메모(최대 200자)" value="' + U.esc(star.memo || "") + '">' +
          '<span class="f-note watch-saved" role="status"></span>' +
        "</div>" +
      "</article>"
    );
  }

  function render() {
    var stars = P.getStars();
    paintTabs(stars);
    var nos = Object.keys(stars)
      .filter(function (no) { return st.state === "전체" || stars[no].state === st.state; })
      .sort(function (a, b) { return String(b).localeCompare(String(a)); });
    var area = document.getElementById("listArea");
    if (!nos.length) {
      area.innerHTML = '<div class="empty-state"><strong>저장한 관심공고가 없습니다</strong>' +
        (st.state === "전체" && !dateFilter
          ? '입찰공고 목록이나 공고 상세에서 ☆ 별표를 누르면 여기에 모입니다.'
          : "다른 상태나 날짜 조건을 선택해 보십시오.") +
        '</div>';
      return;
    }
    area.innerHTML = nos.map(function (no) { return rowHtml(no, stars[no], U.byNo(no)); }).join("");
    area.querySelectorAll(".watch-row").forEach(function (row) {
      var no = row.dataset.no;
      var sel = row.querySelector(".watch-state");
      var memo = row.querySelector(".watch-memo");
      var saved = row.querySelector(".watch-saved");
      function note(msg) { saved.textContent = msg; setTimeout(function () { saved.textContent = ""; }, 2500); }
      sel.addEventListener("change", function () {
        P.setStar(no, { state: sel.value, memo: memo.value });
        note("상태 저장: " + sel.value);
        paintTabs(P.getStars());
      });
      memo.addEventListener("input", function () {
        var cur = P.getStar(no) || { state: P.STAR_STATES[0] };
        P.setStar(no, { state: cur.state, memo: memo.value });
        note("메모 저장");
      });
    });
  }

  P.bindStars(document.getElementById("listArea"), function (no, starred) {
    if (!starred) { render(); } // 해제하면 목록에서 바로 뺀다
  });
  render();
})();
</script>
</body>
</html>
